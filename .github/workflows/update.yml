name: TVBox 自动更新

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'  
  workflow_dispatch:      # 支持手动触发测试

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行更新脚本
        env:
          # 如果搭建了下面的 CF Worker，填你自己的域名；若没有，可先留空
          CF_PROXY: https://tv.gnoix.com
        run: python3 update.py

      - name: 提交并推送到当前仓库
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && echo "无内容变动" && exit 0
          git commit -m "auto update: $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push origin HEAD:master
